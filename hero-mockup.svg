<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="350" cy="220" r="180" fill="#7c3aed" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="500" cy="160" r="120" fill="#38bdf8" opacity="0.14" filter="url(#softGlow)" />

  <!-- Laptop Display Frame -->
  <g filter="url(#boxShadow)">
    <rect x="80" y="40" width="540" height="340" rx="20" fill="url(#laptopBody)" stroke="#334155" stroke-width="2" />
    
    <!-- Camera Dot -->
    <circle cx="350" cy="52" r="3.5" fill="#475569" />
    <circle cx="350" cy="52" r="1.5" fill="#0ea5e9" opacity="0.7" />

    <!-- Screen Inner Display -->
    <rect x="94" y="64" width="512" height="302" rx="10" fill="url(#screenBg)" />

    <!-- Browser Header Bar -->
    <rect x="94" y="64" width="512" height="34" rx="10" fill="#0f172a" />
    <path d="M 94 88 L 94 98 L 606 98 L 606 88 Z" fill="#0f172a" />
    
    <!-- Window Controls -->
    <circle cx="114" cy="81" r="5" fill="#ef4444" />
    <circle cx="129" cy="81" r="5" fill="#f59e0b" />
    <circle cx="144" cy="81" r="5" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="175" y="72" width="280" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="188" cy="81" r="3" fill="#64748b" />
    <text x="200" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#94a3b8">https://shiza-shehzad.design/portfolio</text>

    <!-- Browser Tab Pill -->
    <rect x="470" y="72" width="70" height="18" rx="5" fill="#334155" opacity="0.6" />
    <text x="505" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#cbd5e1" text-anchor="middle">Live Preview</text>

    <!-- Code & Design Split Interface Inside Screen -->
    
    <!-- Left: Modern IDE Code Pane -->
    <rect x="106" y="108" width="190" height="246" rx="8" fill="#0c1222" stroke="#1e293b" stroke-width="1" />
    <rect x="106" y="108" width="190" height="22" rx="8" fill="#141d33" />
    <path d="M 106 122 L 106 130 L 296 130 L 296 122 Z" fill="#141d33" />
    <text x="118" y="123" font-family="monospace" font-size="9" font-weight="600" fill="#a78bfa">&lt;&gt; index.html</text>
    <text x="200" y="123" font-family="monospace" font-size="9" fill="#64748b">style.css</text>

    <!-- Syntax Code Lines -->
    <g font-family="monospace" font-size="8.5">
      <text x="116" y="146" fill="#64748b">01</text>
      <text x="135" y="146" fill="#f43f5e">&lt;section</text>
      <text x="180" y="146" fill="#38bdf8">class</text>
      <text x="205" y="146" fill="#cbd5e1">=</text>
      <text x="212" y="146" fill="#34d399">"hero"&gt;</text>

      <text x="116" y="164" fill="#64748b">02</text>
      <text x="142" y="164" fill="#a78bfa">&lt;h1&gt;</text>
      <text x="168" y="164" fill="#f8fafc">Shiza Shehzad</text>
      <text x="250" y="164" fill="#a78bfa">&lt;/h1&gt;</text>

      <text x="116" y="182" fill="#64748b">03</text>
      <text x="142" y="182" fill="#f43f5e">&lt;span</text>
      <text x="175" y="182" fill="#38bdf8">class</text>
      <text x="200" y="182" fill="#cbd5e1">=</text>
      <text x="206" y="182" fill="#34d399">"role"&gt;</text>

      <text x="116" y="200" fill="#64748b">04</text>
      <text x="150" y="200" fill="#fbbf24">Web Designer</text>

      <text x="116" y="218" fill="#64748b">05</text>
      <text x="142" y="218" fill="#f43f5e">&lt;/span&gt;</text>

      <text x="116" y="236" fill="#64748b">06</text>
      <text x="142" y="236" fill="#38bdf8">&lt;button</text>
      <text x="185" y="236" fill="#34d399">type</text>
      <text x="205" y="236" fill="#cbd5e1">=</text>
      <text x="210" y="236" fill="#34d399">"hire"&gt;</text>

      <text x="116" y="254" fill="#64748b">07</text>
      <text x="150" y="254" fill="#f8fafc">View Work</text>

      <text x="116" y="272" fill="#64748b">08</text>
      <text x="142" y="272" fill="#38bdf8">&lt;/button&gt;</text>

      <text x="116" y="290" fill="#64748b">09</text>
      <text x="135" y="290" fill="#f43f5e">&lt;/section&gt;</text>

      <text x="116" y="308" fill="#64748b">10</text>
      <text x="135" y="308" fill="#818cf8">// BS IT Student</text>
      <text x="116" y="326" fill="#64748b">11</text>
      <text x="135" y="326" fill="#10b981">// Responsive UI</text>
    </g>

    <!-- Right: Rendered Visual UI Design Canvas -->
    <rect x="306" y="108" width="288" height="246" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    
    <!-- Mini Navigation bar inside preview -->
    <rect x="316" y="118" width="268" height="26" rx="6" fill="#1e293b" />
    <circle cx="330" cy="131" r="5" fill="#7c3aed" />
    <rect x="342" y="128" width="45" height="6" rx="3" fill="#cbd5e1" />
    <rect x="475" y="127" width="22" height="7" rx="3.5" fill="#64748b" />
    <rect x="503" y="127" width="24" height="7" rx="3.5" fill="#64748b" />
    <rect x="533" y="124" width="42" height="14" rx="7" fill="url(#accentPurple)" />

    <!-- Hero Card Mockup inside preview -->
    <rect x="316" y="152" width="268" height="110" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
    
    <!-- Hero Mockup content -->
    <rect x="328" y="166" width="60" height="10" rx="5" fill="#7c3aed" opacity="0.4" />
    <rect x="330" y="184" width="130" height="12" rx="4" fill="#ffffff" />
    <rect x="330" y="202" width="115" height="8" rx="4" fill="#94a3b8" />
    <rect x="330" y="215" width="90" height="7" rx="3.5" fill="#64748b" />

    <!-- Interactive Button pills -->
    <rect x="330" y="234" width="55" height="18" rx="9" fill="url(#accentPurple)" />
    <rect x="392" y="234" width="48" height="18" rx="9" fill="#1e293b" stroke="#6366f1" stroke-width="1" />

    <!-- Mini chart / graphic inside hero -->
    <rect x="470" y="166" width="102" height="82" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="521" cy="200" r="24" fill="none" stroke="#334155" stroke-width="5" />
    <circle cx="521" cy="200" r="24" fill="none" stroke="#7c3aed" stroke-width="5" stroke-dasharray="100 50" stroke-linecap="round" />
    <text x="521" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">98%</text>
    <text x="521" y="238" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#38bdf8" text-anchor="middle">Responsive Score</text>

    <!-- Bottom Feature Cards inside preview -->
    <rect x="316" y="270" width="84" height="74" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <circle cx="334" cy="286" r="8" fill="#7c3aed" opacity="0.3" />
    <rect x="326" y="302" width="50" height="6" rx="3" fill="#f1f5f9" />
    <rect x="326" y="313" width="64" height="4" rx="2" fill="#64748b" />
    <rect x="326" y="322" width="40" height="4" rx="2" fill="#64748b" />

    <rect x="408" y="270" width="84" height="74" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <circle cx="426" cy="286" r="8" fill="#06b6d4" opacity="0.3" />
    <rect x="418" y="302" width="52" height="6" rx="3" fill="#f1f5f9" />
    <rect x="418" y="313" width="64" height="4" rx="2" fill="#64748b" />
    <rect x="418" y="322" width="45" height="4" rx="2" fill="#64748b" />

    <rect x="500" y="270" width="84" height="74" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <circle cx="518" cy="286" r="8" fill="#10b981" opacity="0.3" />
    <rect x="510" y="302" width="48" height="6" rx="3" fill="#f1f5f9" />
    <rect x="510" y="313" width="64" height="4" rx="2" fill="#64748b" />
    <rect x="510" y="322" width="38" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Laptop Base & Hinge -->
  <path d="M 40 380 L 660 380 C 675 380, 685 390, 675 400 L 640 404 C 635 405, 75 405, 60 404 L 25 400 C 15 390, 25 380, 40 380 Z" fill="#334155" />
  <path d="M 50 380 L 650 380 L 635 396 L 65 396 Z" fill="#1e293b" />
  <!-- Trackpad Notch -->
  <rect x="305" y="380" width="90" height="5" rx="2" fill="#475569" />

  <!-- Floating Decorative Badges with Soft Shadow -->
  <!-- Floating Pill: Clean Code -->
  <g filter="url(#boxShadow)">
    <rect x="30" y="110" width="135" height="42" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="52" cy="131" r="11" fill="#7c3aed" />
    <text x="52" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="72" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Clean Code</text>
    <text x="72" y="141" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">W3C Compliant</text>
  </g>

  <!-- Floating Pill: 100% Responsive -->
  <g filter="url(#boxShadow)">
    <rect x="535" y="320" width="145" height="44" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="560" cy="342" r="11" fill="#0284c7" />
    <!-- Mobile icon SVG inside circle -->
    <rect x="557" y="337" width="6" height="10" rx="1.5" fill="#ffffff" />
    <text x="580" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">100% Mobile</text>
    <text x="580" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#38bdf8">Fluid Responsive</text>
  </g>

  <!-- Floating Pill: Modern UI/UX -->
  <g filter="url(#boxShadow)">
    <rect x="540" y="90" width="138" height="42" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="562" cy="111" r="10" fill="url(#accentPurple)" />
    <text x="562" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">★</text>
    <text x="580" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Modern UI</text>
    <text x="580" y="121" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#d8b4fe">Client-Ready</text>
  </g>
</svg>

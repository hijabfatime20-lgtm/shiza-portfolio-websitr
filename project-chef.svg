<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chefDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chefGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="chefPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="chefShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect width="600" height="400" fill="#ffffff" rx="16" />
  <rect width="600" height="38" fill="#090d16" rx="16" />
  <path d="M 0 24 L 0 38 L 600 38 L 600 24 Z" fill="#090d16" />
  <circle cx="22" cy="19" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="19" r="4.5" fill="#f59e0b" />
  <circle cx="50" cy="19" r="4.5" fill="#10b981" />
  <rect x="180" y="10" width="240" height="18" rx="9" fill="#1e293b" />
  <text x="300" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#cbd5e1" text-anchor="middle">www.cravekitchen-chef.com/dining</text>

  <!-- Dark Gourmet Canvas -->
  <rect y="38" width="600" height="362" fill="url(#chefDarkBg)" />

  <!-- Gourmet Navbar -->
  <rect y="38" width="600" height="44" fill="#0f172a" opacity="0.9" stroke="#334155" stroke-width="1" />
  <!-- Logo -->
  <circle cx="45" cy="60" r="11" fill="url(#chefGold)" />
  <text x="45" y="65" font-family="serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">🍽</text>
  <text x="64" y="64" font-family="'Playfair Display', serif" font-size="13" font-weight="700" fill="#f8fafc">CRAVE<tspan fill="#f59e0b">KITCHEN</tspan></text>

  <!-- Nav links -->
  <text x="260" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#f59e0b">Chefs</text>
  <text x="320" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Menus</text>
  <text x="380" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">Private Dining</text>
  <text x="460" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">About</text>

  <rect x="515" y="49" width="65" height="22" rx="11" fill="url(#chefGold)" />
  <text x="547" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#0f172a" text-anchor="middle">Book Chef</text>

  <!-- Left Column: Hero Content -->
  <g transform="translate(35, 105)">
    <rect width="125" height="18" rx="9" fill="#334155" />
    <text x="62" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#fbbf24" text-anchor="middle">★ BESPOKE DINING AT HOME</text>
    
    <text x="0" y="48" font-family="'Playfair Display', serif" font-size="23" font-weight="800" fill="#ffffff">Private Master Chefs,</text>
    <text x="0" y="74" font-family="'Playfair Display', serif" font-size="23" font-weight="800" fill="#f59e0b">In Your Kitchen.</text>

    <text x="0" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94a3b8">Experience five-star culinary magic in the comfort of your home.</text>
    <text x="0" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94a3b8">Personalized multi-course menus crafted with artisanal ingredients.</text>

    <rect x="0" y="130" width="115" height="32" rx="16" fill="url(#chefGold)" />
    <text x="57" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Reserve An Evening</text>

    <rect x="125" y="130" width="95" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <text x="172" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">Explore Menus</text>

    <!-- Chef Badge Overlay -->
    <rect x="0" y="180" width="220" height="38" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="199" r="12" fill="#7c3aed" />
    <text x="22" y="203" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">👨‍🍳</text>
    <text x="42" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Chef Marco Rossi</text>
    <text x="42" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#fbbf24">Michelin Star Background • 12 Yrs Exp</text>
  </g>

  <!-- Right Visual: Gourmet Food Card Mockup -->
  <g transform="translate(300, 95)" filter="url(#chefShadow)">
    <rect width="265" height="225" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    
    <!-- Food Presentation Circle Plate -->
    <circle cx="132" cy="95" r="72" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <circle cx="132" cy="95" r="56" fill="#182234" />
    
    <!-- Dish elements -->
    <ellipse cx="132" cy="95" rx="36" ry="24" fill="#d97706" opacity="0.9" />
    <circle cx="120" cy="85" r="10" fill="#10b981" />
    <circle cx="145" cy="88" r="8" fill="#ef4444" />
    <circle cx="132" cy="105" r="7" fill="#fbbf24" />
    <path d="M 105 105 Q 132 118 160 102" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />

    <!-- Culinary Details Bar inside Card -->
    <rect x="18" y="172" width="229" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Truffle Glazed Seared Salmon</text>
    <text x="30" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94a3b8">With asparagus puree &amp; saffron emulsion</text>
    <text x="232" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="end">$85</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(35, 335)">
    <rect width="165" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="21" r="12" fill="#334155" />
    <text x="22" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">✨</text>
    <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">All Equipment Provided</text>
    <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#94a3b8">We bring gourmet cookware</text>
  </g>

  <g transform="translate(215, 335)">
    <rect width="165" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="21" r="12" fill="#334155" />
    <text x="22" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#10b981" text-anchor="middle">🧹</text>
    <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">Spotless Kitchen Cleanup</text>
    <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#94a3b8">Leave the mess to the chef</text>
  </g>

  <g transform="translate(395, 335)">
    <rect width="170" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="21" r="12" fill="#334155" />
    <text x="22" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">🍷</text>
    <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff">Sommelier Wine Pairing</text>
    <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#94a3b8">Curated vintage selections</text>
  </g>
</svg>

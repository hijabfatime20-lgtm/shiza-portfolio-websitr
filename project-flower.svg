<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="flowerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7" />
      <stop offset="50%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#fdf4ff" />
    </linearGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="btnGradFlower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="flowerCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Browser Window Background -->
  <rect width="600" height="400" fill="#ffffff" rx="16" />
  
  <!-- Browser Chrome / Header Bar -->
  <rect width="600" height="38" fill="#1e1b4b" rx="16" />
  <path d="M 0 24 L 0 38 L 600 38 L 600 24 Z" fill="#1e1b4b" />
  <circle cx="22" cy="19" r="4.5" fill="#f43f5e" />
  <circle cx="36" cy="19" r="4.5" fill="#fbbf24" />
  <circle cx="50" cy="19" r="4.5" fill="#34d399" />
  <rect x="180" y="10" width="240" height="18" rx="9" fill="#2e2b69" />
  <text x="300" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#c7d2fe" text-anchor="middle">www.blossomandbloom.com/shop</text>

  <!-- Website Body -->
  <rect y="38" width="600" height="362" fill="url(#flowerBg)" />

  <!-- Boutique Navbar -->
  <rect y="38" width="600" height="44" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
  <!-- Logo -->
  <circle cx="45" cy="60" r="10" fill="#fbcfe8" />
  <circle cx="45" cy="60" r="6" fill="#db2777" />
  <text x="62" y="64" font-family="'Playfair Display', serif, Georgia" font-size="13" font-weight="700" fill="#831843">Blossom &amp; Bloom</text>
  
  <!-- Nav links -->
  <text x="240" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#db2777">Collections</text>
  <text x="310" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Occasions</text>
  <text x="375" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Subscriptions</text>
  <text x="450" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">About</text>

  <!-- Cart Button -->
  <rect x="515" y="49" width="65" height="22" rx="11" fill="url(#btnGradFlower)" />
  <text x="547" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Cart (2)</text>

  <!-- Hero Banner on Left -->
  <g transform="translate(35, 105)">
    <rect width="110" height="18" rx="9" fill="#fce7f3" />
    <text x="55" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#be185d" text-anchor="middle">FRESH SPRING ARRIVALS</text>
    
    <text x="0" y="48" font-family="'Playfair Display', serif, Georgia" font-size="24" font-weight="800" fill="#1e1b4b">Artisan Bouquets</text>
    <text x="0" y="74" font-family="'Playfair Display', serif, Georgia" font-size="24" font-weight="800" fill="#db2777">&amp; Exotic Flora</text>

    <text x="0" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">Handcrafted daily floral arrangements sourced directly</text>
    <text x="0" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">from eco-friendly boutique farms across Europe.</text>

    <rect x="0" y="130" width="105" height="30" rx="15" fill="url(#btnGradFlower)" />
    <text x="52" y="149" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Order Bouquet</text>

    <rect x="115" y="130" width="90" height="30" rx="15" fill="#ffffff" stroke="#db2777" stroke-width="1.2" />
    <text x="160" y="149" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#db2777" text-anchor="middle">View Catalog</text>

    <!-- Star Rating Pill -->
    <rect x="0" y="180" width="180" height="26" rx="13" fill="#ffffff" stroke="#fbcfe8" stroke-width="1" />
    <text x="15" y="197" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#f59e0b">★★★★★</text>
    <text x="75" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1e1b4b">4.9/5</text>
    <text x="105" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">(1,240+ Reviews)</text>
  </g>

  <!-- Right Visual: Flower Bouquet Mockup Canvas & Cards -->
  <g transform="translate(300, 95)" filter="url(#flowerCardShadow)">
    <rect width="265" height="225" rx="18" fill="#ffffff" stroke="#fbcfe8" stroke-width="1" />
    
    <!-- Floral Illustration Graphic inside Card -->
    <circle cx="132" cy="100" r="75" fill="#fff1f2" />
    <circle cx="110" cy="85" r="32" fill="url(#petalGrad1)" opacity="0.85" />
    <circle cx="155" cy="85" r="32" fill="url(#petalGrad2)" opacity="0.85" />
    <circle cx="132" cy="65" r="30" fill="#f43f5e" opacity="0.8" />
    <circle cx="132" cy="115" r="30" fill="#db2777" opacity="0.8" />
    <circle cx="132" cy="90" r="16" fill="#fef08a" />
    
    <!-- Leaves / Stems -->
    <path d="M 132 120 Q 132 170 120 185" stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 132 140 Q 155 130 165 142 Q 148 152 132 140 Z" fill="#059669" />
    <path d="M 130 155 Q 105 148 98 160 Q 115 168 130 155 Z" fill="#10b981" />

    <!-- Product Tag inside card -->
    <rect x="20" y="175" width="225" height="38" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
    <text x="32" y="191" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#1e1b4b">Lavender Rose Symphony</text>
    <text x="32" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#9333ea">Hand-tied with silk ribbon</text>
    <text x="225" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#db2777" text-anchor="end">$49.00</text>
  </g>

  <!-- Bottom Mini Cards -->
  <g transform="translate(35, 335)">
    <rect width="165" height="42" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    <circle cx="22" cy="21" r="12" fill="#dcfce7" />
    <text x="22" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">⚡</text>
    <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1e293b">Same-Day Delivery</text>
    <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#64748b">Guaranteed fresh arrival</text>
  </g>

  <g transform="translate(215, 335)">
    <rect width="165" height="42" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    <circle cx="22" cy="21" r="12" fill="#fef3c7" />
    <text x="22" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#d97706" text-anchor="middle">🌸</text>
    <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1e293b">100% Eco-Friendly</text>
    <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#64748b">Sustainable packaging</text>
  </g>

  <g transform="translate(395, 335)">
    <rect width="170" height="42" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
    <circle cx="22" cy="21" r="12" fill="#f3e8ff" />
    <text x="22" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#9333ea" text-anchor="middle">🎁</text>
    <text x="42" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#1e293b">Custom Gift Cards</text>
    <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#64748b">Free calligraphy message</text>
  </g>
</svg>
